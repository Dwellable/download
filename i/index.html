<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- Lets Messages and Safari show the Dwellable App Clip card for invite links
       (https://dwellable.app/i/?c=<code>); the App Clip reads the code from the URL. -->
  <meta name="apple-itunes-app" content="app-id=6444394386, app-clip-bundle-id=app.dwellable.Clip, app-clip-display=card">
  <title>Your Dwellable invite</title>
  <meta property="og:title" content="Your Dwellable invite">
  <meta property="og:description" content="Connect your number and see what we know about your home.">
  <meta property="og:image" content="https://dwellable.app/og_image.png">
  <link rel="icon" type="image/x-icon" href="/favicon.png">
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 48px 20px; color: #1b1f1d; background: #fff; line-height: 1.5; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: #555; margin: 0 0 16px; }
    a.button { display: inline-block; background: #42564D; color: #fff; padding: 12px 20px; border-radius: 12px; text-decoration: none; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } p { color: #aaa; } a.button { background: #82AC98; color: #111; } }
  </style>
</head>
<body>
  <img src="/favicon.png" alt="" width="56" height="56" style="border-radius:12px">
  <h1>Your Dwellable invite</h1>
  <p>Open this link on your iPhone to set up your home and connect your number. If you have the Dwellable app, it will open there.</p>
  <a class="button" href="https://apps.apple.com/app/id6444394386">Get Dwellable</a>
</body>
</html>
