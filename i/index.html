<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- Lets Messages and Safari show the Dwellable App Clip card for invite links
       (https://dwellable.app/i/?c=<code>); the App Clip reads the code from the URL. -->
  <meta name="apple-itunes-app" content="app-id=6444394386, app-clip-bundle-id=app.dwellable.Clip, app-clip-display=card">
  <title>Your Dwellable invite</title>
  <meta property="og:title" content="Text Dwellable">
  <meta property="og:description" content="Connect your number to get help with your home by text">
  <meta property="og:image" content="https://dwellable.app/i/text_dwellable.jpg">
  <meta property="og:image:width" content="1800">
  <meta property="og:image:height" content="1200">
  <link rel="icon" type="image/x-icon" href="/favicon.png">
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 12px 20px 48px; color: #1b1f1d; background: #fff; line-height: 1.5; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: #555; margin: 0 0 16px; }
    /* Points at the App Clip banner Safari shows above the page; its Open button is on the right. */
    .point { text-align: right; padding-right: 14px; font-size: 56px; line-height: 1; margin-bottom: 20px; }
    .point span { display: inline-block; animation: nudge 1.2s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @media (prefers-reduced-motion: reduce) { .point span { animation: none; } }
    .small { font-size: 14px; color: #888; }
    @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } p { color: #aaa; } .small { color: #777; } }
  </style>
</head>
<body>
  <div class="point" aria-hidden="true"><span>👆</span></div>
  <img src="/favicon.png" alt="" width="56" height="56" style="border-radius:12px">
  <h1>Tap Open up there</h1>
  <p>Tap <strong>Open</strong> in the Dwellable bar at the top of your screen to connect your number. It takes about a minute.</p>
  <p class="small">Don't see it? Open this link on your iPhone, in Safari.</p>
</body>
</html>
